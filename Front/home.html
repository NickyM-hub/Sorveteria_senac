<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorveteria - Área Administrativa</title>

    <link rel="stylesheet" href="home.css">
</head>

<body>

    <div class="pagina">
        <div class="lado-esquerdo">

            <div class="logo">
                <img src="assets/174abd99886daa8c28234ed9a215fb119e88e082.png" id="Sorvete" alt="Logo da Sorveteria" width="300" height="400">

                <h2>Sorveteria</h2>

                <p>Mais sabor no seu dia!</p>

            </div>-

        </div>

        <div class="lado-direito">

            <div class="login">

                <h1>Área Administrativa</h1>

                <p class="descricao">
                    Faça login para acessar o sistema
                </p>

                <form>

                    <input
                        type="text"
                        placeholder="Usuário ou e-mail"
                    >

                    <input
                        type="password"
                        placeholder="Senha"
                    >

                    <label class="lembrar">
                        <input type="checkbox">
                        <span>Lembre de mim</span>
                    </label>

                    <button type="submit">
                        Entrar
                    </button>

                    <a href="#" class="esqueci">
                        Esqueci minha senha?
                    </a>

                    <a href="#" class="cadastro">
                        Cadastre-se
                    </a>

                </form>

            </div>

        </div>

    </div>

</body>
</html>
