
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro - Sorveteria</title>

    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>

    <main class="container">

        <section class="login-area cadastro-area">

            <h2>Crie sua conta!</h2>

            <p class="subtitulo">
                Cadastre-se para fazer seus pedidos.
            </p>

            <form action="#" method="post">

                <input
                    type="text"
                    name="nome"
                    placeholder="Nome completo"
                    autocomplete="name"
                    required
                >

                <input
                    type="email"
                    name="email"
                    placeholder="E-mail"
                    autocomplete="email"
                    required
                >

                <input
                    type="tel"
                    name="telefone"
                    placeholder="Telefone"
                    autocomplete="tel"
                    required
                >

                <input
                    type="password"
                    name="senha"
                    placeholder="Crie uma senha"
                    autocomplete="new-password"
                    required
                >

                <input
                    type="password"
                    name="confirmar_senha"
                    placeholder="Confirme sua senha"
                    autocomplete="new-password"
                    required
                >

                <label class="termos">
                    <input type="checkbox" name="termos" required>
                    Li e aceito os termos de<span class="rosa">Uso</span> e a <span class="rosa">Política de Privacidade</span>.
                </label>

                <button type="submit">Criar conta</button>

                <p class="voltar-login">
                    Já tem uma conta?
                    <a href="login.html">Entrar</a>
                </p>

            </form>

        </section>

    </main>

</body>
</html>
