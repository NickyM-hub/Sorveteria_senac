
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meus dados - Sorveteria</title>

    <link rel="stylesheet" href="css/estilo.css">

    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body class="body-perfil">

    <main class="pagina">

        <header class="pagina-topo">

            <a href="perfil.html" class="voltar" aria-label="Voltar">
                <i class="fa-solid fa-arrow-left"></i>
            </a>

            <section>
                <small>MINHA CONTA</small>
                <h1>Meus dados</h1>
            </section>

        </header>


        <section class="cartao-intro">

            <span class="intro-icone">
                <i class="fa-solid fa-user-pen"></i>
            </span>

            <h2>Seus dados pessoais</h2>

            <p>
                Mantenha suas informações atualizadas para facilitar seus pedidos.
            </p>

        </section>


        <form class="formulario" action="#" method="post">

            <h2>Informações pessoais</h2>

            <label for="nome">Nome completo</label>

            <input
                id="nome"
                name="nome"
                type="text"
                value="Ana Carolina Santos"
                required
            >

            <label for="email">E-mail</label>

            <input
                id="email"
                name="email"
                type="email"
                value="aninha123@gmail.com"
                required
            >

            <label for="telefone">Telefone / WhatsApp</label>

            <input
                id="telefone"
                name="telefone"
                type="tel"
                placeholder="(11) 99999-9999"
            >

            <label for="nascimento">Data de nascimento</label>

            <input
                id="nascimento"
                name="nascimento"
                type="date"
            >

            <button type="submit" class="botao-principal">
                <i class="fa-solid fa-check"></i>
                Salvar alterações
            </button>

            <a href="perfil.html" class="botao-secundario">
                Cancelar
            </a>

        </form>

    </main>

</body>
</html>
