
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Verificar código - Sorveteria</title>

    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <main class="container">

        <!-- Etapas da recuperação -->
        <nav class="etapas" aria-label="Etapas da recuperação de senha">

            <section class="etapa concluida">
                <span class="circulo">✓</span>
                <span>E-mail</span>
            </section>

            <span class="linha"></span>

            <section class="etapa ativa">
                <span class="circulo">2</span>
                <span>Verificar</span>
            </section>

            <span class="linha"></span>

            <section class="etapa">
                <span class="circulo">3</span>
                <span>Nova senha</span>
            </section>

        </nav>

        <section class="login-area recuperar-area">

            <p class="sticker-email" aria-hidden="true">📩</p>

            <h2>Verifique seu e-mail</h2>

            <p class="subtitulo">
                Enviamos um código de verificação para
                o seu e-mail. Digite-o abaixo.
            </p>

            <form action="nova-senha.html" method="get">

                <input
                    type="text"
                    name="codigo"
                    placeholder="Digite o código de 6 dígitos"
                    inputmode="numeric"
                    pattern="[0-9]{6}"
                    maxlength="6"
                    autocomplete="one-time-code"
                    required
                >

                <button type="submit">
                    Verificar código
                </button>

                <a href="#" class="voltar" id="reenviarCodigo">
                    Não recebi o código
                </a>

                <p
                    id="mensagemCodigo"
                    class="mensagem-codigo"
                    role="status"
                    aria-live="polite">
                </p>

            </form>

        </section>

    </main>

    <script>

        document.getElementById("reenviarCodigo")
            .addEventListener("click", function(event) {

                event.preventDefault();

                document.getElementById("mensagemCodigo")
                    .textContent =
                    "✓ Um novo código foi enviado para seu e-mail!";

            });

    </script>

</body>
</html>
