
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Sorveteria</title>

    <link rel="stylesheet" href="css/estilo.css">
</head>

<body>

    <main class="container">

        <!-- Logo da sorveteria -->
        <header class="logo-area">

            <p class="sorvete" aria-hidden="true">🍦</p>

            <h1 class="titulo-curvo" aria-label="Sorveteria">

                <svg viewBox="0 0 320 110" aria-hidden="true">

                    <defs>
                        <path id="curva" d="M 20,85 Q 160,-10 300,85" />
                    </defs>

                    <text>
                        <textPath href="#curva"
                            startOffset="50%"
                            text-anchor="middle">
                            Sorveteria
                        </textPath>
                    </text>

                </svg>

            </h1>

            <p>Mais sabor no seu dia!</p>

        </header>

        <!-- Área de login -->
        <section class="login-area">

            <h2>Bem-vindo(a)!</h2>

            <p class="subtitulo">
                Faça login para continuar
            </p>

            <form action="inicio.html" method="post">

                <input
                    type="text"
                    name="usuario"
                    placeholder="CPF ou e-mail"
                    autocomplete="username"
                    required
                >

                <input
                    type="password"
                    name="senha"
                    placeholder="Senha"
                    autocomplete="current-password"
                    required
                >

                <section class="lembrar">

                    <label>
                        <input type="checkbox" name="lembrar">
                        Lembre de mim
                    </label>

                </section>

                <button type="submit">
                    Entrar
                </button>

                <a href="recuperar-senha.html" class="esqueci">
                    Esqueci minha senha?
                </a>

                <a href="cadastro.html" class="cadastro">
                    Cadastre-se
                </a>

            </form>

        </section>

    </main>

</body>
</html>
