
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar senha - Sorveteria</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>

<main class="container">

    <section class="etapas">
        <div class="etapa ativa">
            <div class="circulo">1</div>
            <span>E-mail</span>
        </div>
        <div class="linha"></div>
        <div class="etapa">
            <div class="circulo">2</div>
            <span>Verificar</span>
        </div>
        <div class="linha"></div>
        <div class="etapa">
            <div class="circulo">3</div>
            <span>Nova senha</span>
        </div>
    </section>

    <section class="login-area recuperar-area">

        <div class="sticker-email">💌</div>

        <h2>Recuperar senha</h2>

        <p class="subtitulo">
            Informe seu e-mail para receber o código
            de verificação.
        </p>

        <form action="#" method="post">

            <input
                type="email"
                name="email"
                placeholder="Digite seu e-mail"
                autocomplete="email"
                required
            >

            <button type="submit">Enviar código</button>

            <a href="index.html" class="voltar">
                ← Voltar para o login
            </a>

        </form>

    </section>
</main>

</body>
</html>
