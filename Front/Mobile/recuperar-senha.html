
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recuperar senha - Sorveteria</title>

    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <main class="container">

        <!-- Etapas da recuperação -->
        <nav class="etapas" aria-label="Etapas da recuperação de senha">

            <section class="etapa ativa">
                <span class="circulo">1</span>
                <span>E-mail</span>
            </section>

            <span class="linha"></span>

            <section class="etapa">
                <span class="circulo">2</span>
                <span>Verificar</span>
            </section>

            <span class="linha"></span>

            <section class="etapa">
                <span class="circulo">3</span>
                <span>Nova senha</span>
            </section>

        </nav>

        <section class="login-area recuperar-area">

            <p class="sticker-email" aria-hidden="true">💌</p>

            <h2>Recuperar senha</h2>

            <p class="subtitulo">
                Informe seu e-mail para receber o código
                de verificação.
            </p>

            <form action="verificar-codigo.html" method="get">

                <input
                    type="email"
                    name="email"
                    placeholder="Digite seu e-mail"
                    autocomplete="email"
                    required
                >

                <button type="submit">
                    Enviar código
                </button>

                <a href="login.html" class="voltar">
                    ← Voltar para o login
                </a>

            </form>

        </section>

    </main>

</body>
</html>
