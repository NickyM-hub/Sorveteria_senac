
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nova senha - Sorveteria</title>

    <link rel="stylesheet" href="css/estilo.css">
</head>

<body>

    <main class="container">

        <!-- Etapas da recuperação -->
        <nav class="etapas" aria-label="Etapas da recuperação de senha">

            <section class="etapa concluida">
                <span class="circulo">✓</span>
                <span>E-mail</span>
            </section>

            <span class="linha"></span>

            <section class="etapa concluida">
                <span class="circulo">✓</span>
                <span>Verificar</span>
            </section>

            <span class="linha"></span>

            <section class="etapa ativa">
                <span class="circulo">3</span>
                <span>Nova senha</span>
            </section>

        </nav>

        <section class="login-area recuperar-area">

            <p class="sticker-email" aria-hidden="true">🔑</p>

            <h2>Crie uma nova senha</h2>

            <p class="subtitulo">
                Escolha uma nova senha para acessar
                sua conta novamente.
            </p>

            <form action="login.html" method="post">

                <input
                    type="password"
                    name="nova_senha"
                    placeholder="Digite a nova senha"
                    autocomplete="new-password"
                    minlength="8"
                    required
                >

                <input
                    type="password"
                    name="confirmar_senha"
                    placeholder="Confirme a nova senha"
                    autocomplete="new-password"
                    minlength="8"
                    required
                >

                <p class="dica-senha">
                    A senha deve ter pelo menos 8 caracteres.
                </p>

                <button type="submit">
                    Salvar nova senha
                </button>

            </form>

        </section>

    </main>

</body>
</html>
