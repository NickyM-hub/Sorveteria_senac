
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Detalhes do Açaí - Sorveteria</title>

    <link rel="stylesheet" href="css/estilo.css">
</head>

<body class="body-acai">

    <main class="tela-acai">

        <!-- Cabeçalho e imagem -->
        <header class="cabecalho-acai">

            <a href="inicio.html" class="voltar" aria-label="Voltar">
                &#8249;
            </a>

            <img
                src="imagens/acair.png"
                alt="Tigela de açaí com frutas"
                class="imagem-acai"
            >

        </header>

        <!-- Informações do produto -->
        <section class="detalhe-produto detalhe-acai"
            aria-labelledby="nomeProduto">

            <section class="informacoes-detalhe">

                <h1 id="nomeProduto">Açaí Tradicional</h1>

                <p class="nota-produto">
                    <span class="estrelas" aria-label="5 estrelas">★★★★★</span>
                    <span id="notaProduto">4,8</span>

                    <a href="#avaliacoes" class="link-avaliacoes">
                        Ver avaliações
                    </a>
                </p>

                <p id="descricaoProduto">
                    Açaí cremoso e saboroso, perfeito para combinar com suas
                    frutas e adicionais favoritos!
                </p>

                <strong class="preco-detalhe" id="precoProduto">
                    R$ 15,50
                </strong>

            </section>

        </section>

        <!-- Tamanhos -->
        <section class="opcoes-produto" aria-labelledby="tituloTamanho">

            <h2 id="tituloTamanho">Escolha o tamanho</h2>
            <p class="texto-auxiliar">Selecione uma opção:</p>

            <section class="opcoes-tamanho" aria-label="Tamanhos disponíveis">

                <label class="opcao-tamanho">
                    <input
                        type="radio"
                        name="tamanho"
                        value="200"
                        data-preco="15.50"
                        checked
                    >
                    <span>200 ml</span>
                    <small id="preco200">R$ 15,50</small>
                </label>

                <label class="opcao-tamanho">
                    <input
                        type="radio"
                        name="tamanho"
                        value="400"
                        data-preco="24.50"
                    >
                    <span>400 ml</span>
                    <small id="preco400">R$ 24,50</small>
                </label>

                <label class="opcao-tamanho">
                    <input
                        type="radio"
                        name="tamanho"
                        value="500"
                        data-preco="30.50"
                    >
                    <span>500 ml</span>
                    <small id="preco500">R$ 30,50</small>
                </label>

            </section>

        </section>

        <!-- Adicionais -->
        <section class="secao-escolhas" aria-labelledby="tituloAdicionais">

            <header class="titulo-escolhas">
                <h2 id="tituloAdicionais">Adicionais</h2>
                <p>3 grátis, extras pagos</p>
            </header>

            <section class="lista-opcoes" aria-label="Opções de adicionais">

                <label class="opcao-item">
                    <input type="checkbox" name="adicionais-gratis"
                        value="Granola" data-preco="1.50">
                    <span>Granola</span>
                    <small>R$ 1,50 após os grátis</small>
                </label>

                <label class="opcao-item">
                    <input type="checkbox" name="adicionais-gratis"
                        value="Paçoca" data-preco="1.50">
                    <span>Paçoca</span>
                    <small>R$ 1,50 após os grátis</small>
                </label>

                <label class="opcao-item">
                    <input type="checkbox" name="adicionais-gratis"
                        value="Leite Condensado" data-preco="1.50">
                    <span>Leite Condensado</span>
                    <small>R$ 1,50 após os grátis</small>
                </label>

                <label class="opcao-item">
                    <input type="checkbox" name="adicionais-gratis"
                        value="Cupuaçu" data-preco="1.50">
                    <span>Cupuaçu</span>
                    <small>R$ 1,50 após os grátis</small>
                </label>

                <label class="opcao-item">
                    <input type="checkbox" name="adicionais-gratis"
                        value="Leite Ninho" data-preco="1.50">
                    <span>Leite Ninho</span>
                    <small>R$ 1,50 após os grátis</small>
                </label>

                <label class="opcao-item">
                    <input type="checkbox" name="adicionais-gratis"
                        value="M&M's" data-preco="1.50">
                    <span>M&M's</span>
                    <small>R$ 1,50 após os grátis</small>
                </label>

                <label class="opcao-item">
                    <input type="checkbox" name="adicionais-pagos"
                        value="Ovomaltine" data-preco="1.00">
                    <span>Ovomaltine</span>
                    <small>R$ 1,00</small>
                </label>

                <label class="opcao-item">
                    <input type="checkbox" name="adicionais-pagos"
                        value="Nutella" data-preco="2.00">
                    <span>Nutella</span>
                    <small>R$ 2,00</small>
                </label>

            </section>

        </section>

        <!-- Frutas -->
        <section class="secao-escolhas secao-frutas"
            aria-labelledby="tituloFrutas">

            <header class="titulo-escolhas">
                <h2 id="tituloFrutas">Frutas</h2>
                <p>2 grátis, extras pagos</p>
            </header>

            <section class="lista-opcoes" aria-label="Opções de frutas">

                <label class="opcao-item">
                    <input type="checkbox" name="frutas"
                        value="Uva" data-preco="2.00">
                    <span>Uva</span>
                    <small>R$ 2,00 após as grátis</small>
                </label>

                <label class="opcao-item">
                    <input type="checkbox" name="frutas"
                        value="Morango" data-preco="2.00">
                    <span>Morango</span>
                    <small>R$ 2,00 após as grátis</small>
                </label>

                <label class="opcao-item">
                    <input type="checkbox" name="frutas"
                        value="Banana" data-preco="2.00">
                    <span>Banana</span>
                    <small>R$ 2,00 após as grátis</small>
                </label>

                <label class="opcao-item">
                    <input type="checkbox" name="frutas"
                        value="Kiwi" data-preco="2.00">
                    <span>Kiwi</span>
                    <small>R$ 2,00 após as grátis</small>
                </label>

                <label class="opcao-item">
                    <input type="checkbox" name="frutas"
                        value="Manga" data-preco="2.00">
                    <span>Manga</span>
                    <small>R$ 2,00 após as grátis</small>
                </label>

            </section>

        </section>

        <!-- Resumo do pedido -->
        <section class="resumo-produto" aria-label="Resumo do pedido">

            <section class="controle-quantidade">

                <span>Quantidade</span>

                <section class="botoes-quantidade">

                    <button type="button" id="diminuirQuantidade"
                        aria-label="Diminuir quantidade">−</button>

                    <output id="quantidadeProduto" aria-live="polite">1</output>

                    <button type="button" id="aumentarQuantidade"
                        aria-label="Aumentar quantidade">+</button>

                </section>

            </section>

            <p class="linha-total">
                <span>Total do pedido</span>
                <strong id="totalProduto">R$ 15,50</strong>
            </p>

        </section>

        <!-- Botões -->
        <footer class="acoes-acai">

            <button type="button" class="botao-carrinho">
                Adicionar ao carrinho
            </button>

            <button type="button" class="botao-comprar">
                Comprar agora
            </button>

        </footer>

    </main>

    <!-- JavaScript da página -->
    <script>
    "use strict";

    document.addEventListener("DOMContentLoaded", () => {

        const chaveCarrinho = "carrinhoSorveteria";

        const tamanhos = document.querySelectorAll(
            'input[name="tamanho"]'
        );

        const adicionaisGratis = document.querySelectorAll(
            'input[name="adicionais-gratis"]'
        );

        const adicionaisPagos = document.querySelectorAll(
            'input[name="adicionais-pagos"]'
        );

        const frutas = document.querySelectorAll(
            'input[name="frutas"]'
        );

        const quantidadeTexto = document.getElementById("quantidadeProduto");
        const totalProdutoTexto = document.getElementById("totalProduto");
        const precoProdutoTexto = document.getElementById("precoProduto");

        const botaoDiminuir = document.getElementById("diminuirQuantidade");
        const botaoAumentar = document.getElementById("aumentarQuantidade");

        const botaoCarrinho = document.querySelector(".botao-carrinho");
        const botaoComprar = document.querySelector(".botao-comprar");

        let quantidade = 1;

        // Formata os valores para reais.
        function moeda(valor) {
            return valor.toLocaleString("pt-BR", {
                style: "currency",
                currency: "BRL"
            });
        }

        // Retorna somente os campos selecionados.
        function selecionados(lista) {
            return [...lista].filter(item => item.checked);
        }

        // Calcula o valor dos adicionais e das frutas.
        function calcularExtras() {

            let total = 0;
            const adicionais = [];

            // Três primeiros adicionais são gratuitos.
            selecionados(adicionaisGratis).forEach((item, indice) => {

                const preco = indice < 3
                    ? 0
                    : Number(item.dataset.preco || 1.50);

                total += preco;

                adicionais.push({
                    nome: item.value,
                    preco: preco
                });

            });

            // Adicionais pagos.
            selecionados(adicionaisPagos).forEach(item => {

                const preco = Number(item.dataset.preco || 0);

                total += preco;

                adicionais.push({
                    nome: item.value,
                    preco: preco
                });

            });

            // Duas primeiras frutas são gratuitas.
            selecionados(frutas).forEach((item, indice) => {

                const preco = indice < 2
                    ? 0
                    : Number(item.dataset.preco || 2.00);

                total += preco;

                adicionais.push({
                    nome: item.value,
                    preco: preco
                });

            });

            return {
                total,
                adicionais
            };

        }

        // Busca o preço do tamanho selecionado.
        function obterPrecoTamanho() {

            const selecionado = document.querySelector(
                'input[name="tamanho"]:checked'
            );

            return selecionado
                ? Number(selecionado.dataset.preco || 0)
                : 0;

        }

        // Atualiza o resumo do pedido.
        function atualizarResumo() {

            const extras = calcularExtras();

            const precoBase = obterPrecoTamanho();

            const precoUnitario = precoBase + extras.total;

            const total = precoUnitario * quantidade;

            quantidadeTexto.textContent = quantidade;

            totalProdutoTexto.textContent = moeda(total);

            precoProdutoTexto.textContent = moeda(precoBase);

        }

        // Diminuir quantidade.
        botaoDiminuir.addEventListener("click", () => {

            if (quantidade > 1) {
                quantidade--;
                atualizarResumo();
            }

        });

        // Aumentar quantidade.
        botaoAumentar.addEventListener("click", () => {

            quantidade++;
            atualizarResumo();

        });

        // Atualiza os valores quando alguma opção mudar.
        [...tamanhos, ...adicionaisGratis, ...adicionaisPagos, ...frutas]
            .forEach(item => {

                item.addEventListener("change", atualizarResumo);

            });

        // Salva o produto no carrinho.
        function adicionarAoCarrinho() {

            const escolhidosGratis = selecionados(adicionaisGratis);

            if (escolhidosGratis.length < 3) {

                alert("Escolha pelo menos 3 adicionais gratuitos.");

                return false;

            }

            const tamanho = document.querySelector(
                'input[name="tamanho"]:checked'
            );

            if (!tamanho) {

                alert("Escolha o tamanho do açaí.");

                return false;

            }

            const extras = calcularExtras();

            const precoBase = obterPrecoTamanho();

            const precoUnitario = precoBase + extras.total;

            const produto = {

                nome: "Açaí Tradicional",

                descricao: "Açaí cremoso com frutas e adicionais.",

                imagem: "imagens/acair.png",

                tamanho: tamanho.value + " ml",

                quantidade: quantidade,

                adicionais: extras.adicionais,

                precoUnitario: precoUnitario

            };

            let carrinho = [];

            try {

                carrinho = JSON.parse(
                    localStorage.getItem(chaveCarrinho) || "[]"
                );

                if (!Array.isArray(carrinho)) {
                    carrinho = [];
                }

            } catch (erro) {

                carrinho = [];

            }

            // Identifica produtos com as mesmas escolhas.
            const assinatura = item => JSON.stringify([

                item.nome,

                item.tamanho,

                [...(item.adicionais || [])]
                    .sort((a, b) => a.nome.localeCompare(b.nome))

            ]);

            const existente = carrinho.find(
                item => assinatura(item) === assinatura(produto)
            );

            if (existente) {

                existente.quantidade =
                    Number(existente.quantidade || 0) + quantidade;

            } else {

                carrinho.push(produto);

            }

            localStorage.setItem(
                chaveCarrinho,
                JSON.stringify(carrinho)
            );

            return true;

        }

        // Adicionar ao carrinho.
        botaoCarrinho.addEventListener("click", () => {

            if (adicionarAoCarrinho()) {

                window.location.href = "carrinho.html";

            }

        });

        // Comprar agora.
        botaoComprar.addEventListener("click", () => {

            if (adicionarAoCarrinho()) {

                window.location.href = "carrinho.html";

            }

        });

        // Inicializa os valores.
        atualizarResumo();

    });
    </script>

</body>
</html>
