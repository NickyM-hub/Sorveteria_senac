
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bebidas - Sorveteria</title>

    <link rel="stylesheet" href="css/estilo.css">
</head>

<body>

    <main class="pagina-bebidas">

        <!-- Cabeçalho -->
        <header class="cabecalho-bebidas">

            <a class="voltar"
               href="inicio.html"
               aria-label="Voltar para o início">
                ‹
            </a>

            <h1>Bebidas</h1>

        </header>

        <!-- Pesquisa de bebidas -->
        <input
            type="search"
            class="busca-bebidas"
            placeholder="Buscar bebidas"
            aria-label="Buscar bebidas"
        >

        <!-- Lista de bebidas -->
        <section class="lista-bebidas" aria-label="Lista de bebidas">

            <!-- Milk-shake Oreo -->
            <article class="card-bebida">

                <a href="detalhes-bebida.html?produto=milkshake-oreo"
                   class="link-card-bebida">

                    <img
                        src="imagens/milkshake-oreo.png"
                        alt="Milk-shake de Oreo"
                        class="foto-bebida"
                    >

                    <section class="info-bebida">

                        <h2>Milk-shake Oreo</h2>

                        <p>Cremoso e delicioso!</p>

                        <section class="detalhes-bebida">

                            <p class="preco-bebida">R$ 15,50</p>

                            <span class="tamanho-bebida">400ml</span>

                        </section>

                    </section>

                </a>

                <button class="botao-adicionar-bebida" type="button">
                    Adicionar
                </button>

            </article>

            <!-- Coca-Cola -->
            <article class="card-bebida">

                <a href="detalhes-bebida.html?produto=coca-cola"
                   class="link-card-bebida">

                    <img
                        src="imagens/coca-cola.png"
                        alt="Lata de Coca-Cola"
                        class="foto-bebida"
                    >

                    <section class="info-bebida">

                        <h2>Coca-Cola</h2>

                        <p>Refrigerante gelado!</p>

                        <section class="detalhes-bebida">

                            <p class="preco-bebida">R$ 3,90</p>

                            <span class="tamanho-bebida">350ml</span>

                        </section>

                    </section>

                </a>

                <button class="botao-adicionar-bebida" type="button">
                    Adicionar
                </button>

            </article>

            <!-- Água mineral -->
            <article class="card-bebida">

                <a href="detalhes-bebida.html?produto=agua-mineral"
                   class="link-card-bebida">

                    <img
                        src="imagens/agua-mineral.png"
                        alt="Garrafa de água mineral"
                        class="foto-bebida"
                    >

                    <section class="info-bebida">

                        <h2>Água mineral</h2>

                        <p>Clássica e deliciosa!</p>

                        <section class="detalhes-bebida">

                            <p class="preco-bebida">R$ 2,00</p>

                            <span class="tamanho-bebida">500ml</span>

                        </section>

                    </section>

                </a>

                <button class="botao-adicionar-bebida" type="button">
                    Adicionar
                </button>

            </article>

            <!-- Milk-shake de caramelo -->
            <article class="card-bebida">

                <a href="detalhes-bebida.html?produto=milkshake-caramelo"
                   class="link-card-bebida">

                    <img
                        src="imagens/milkshake-caramelo.png"
                        alt="Milk-shake de caramelo"
                        class="foto-bebida"
                    >

                    <section class="info-bebida">

                        <h2>Milk-shake caramelo</h2>

                        <p>Três sabores em um só!</p>

                        <section class="detalhes-bebida">

                            <p class="preco-bebida">R$ 21,00</p>

                            <span class="tamanho-bebida">500ml</span>

                        </section>

                    </section>

                </a>

                <button class="botao-adicionar-bebida" type="button">
                    Adicionar
                </button>

            </article>

        </section>

    </main>
    
    <!-- Menu inferior -->
    <nav class="menu-inferior" aria-label="Menu principal">

        <a href="inicio.html" class="item-menu ativo">
            <span class="icone">&#8962;</span>
            <span>Início</span>
        </a>

        <a href="cupons.html" class="item-menu">
            <span class="icone">&#9737;</span>
            <span>Cupons</span>
        </a>

        <a href="carrinho.html" class="item-menu">
            <span class="icone">&#128722;</span>
            <span>Carrinho</span>
        </a>

        <a href="meus-pedidos.html" class="item-menu">
            <span class="icone">&#9776;</span>
            <span>Pedidos</span>
        </a>

        <a href="perfil.html" class="item-menu">
            <span class="icone">&#9818;</span>
            <span>Perfil</span>
        </a>

    </nav>

    
    

</body>
</html>
