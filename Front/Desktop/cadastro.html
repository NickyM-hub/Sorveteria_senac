
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Sorveteria</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="pagina-auth">

        <section class="marca">
            <img src="img/logo.png" alt="Logo Sorveteria">
            <h1>Sorveteria</h1>
            <p>Mais sabor no seu dia!</p>
        </section>

        <section class="form-auth">

            <h2>Cadastro</h2>

            <form action="#" method="post">

                <input type="text" placeholder="Nome completo" required>

                <input type="text" placeholder="CPF" required>

                <input type="email" placeholder="E-mail" required>

                <input type="tel" placeholder="Telefone" required>

                <input type="text" placeholder="Endereço" required>

                <input type="text" placeholder="Cargo" required>

                <input type="password" placeholder="Senha" required>

                <input type="password" placeholder="Confirmar senha" required>

                <button type="submit" class="botao-principal">
                    Cadastrar
                </button>

            </form>

            <a href="login.html" class="link-auxiliar">
                Já possui cadastro? Entrar
            </a>

        </section>

    </main>

</body>
</html>
