
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sorveteria</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="pagina-auth">

        <section class="marca">
            <img src="/Front/assets/Logo_Sorveteria.jpg" alt="Logo Sorveteria">
            <h1>Sorveteria</h1>
            <p>Mais sabor no seu dia!</p>
        </section>

        <section class="form-auth">

            <h2>Área Administrativa</h2>

            <p style="text-align:center; font-size:10px; margin-bottom:20px;">
                Faça login para acessar o sistema
            </p>

            <form action="#" method="post">

                <input type="email" placeholder="E-mail" required>

                <input type="password" placeholder="Senha" required>

                <label style="display:flex; align-items:center; gap:5px;">
                    <input type="checkbox" style="width:auto; height:auto;">
                    Lembrar de mim
                </label>

                <button type="submit" class="botao-principal">
                    Entrar
                </button>

            </form>

            <a href="recup_senha.html" class="link-auxiliar">
                Esqueceu a senha?
            </a>

            <a href="cadastro.html" class="link-cadastro">
                Cadastre-se
            </a>

        </section>

    </main>

</body>
</html>
